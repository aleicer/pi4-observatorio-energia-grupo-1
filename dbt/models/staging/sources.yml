# Las fuentes de dbt: las tablas de la capa plata que dbt va a leer.
# Es un archivo YAML: no se ejecuta; dbt lo lee para saber de donde salen los datos.
version: 2

sources:
  # Una fuente llamada "plata". En los .sql se usa asi: source('plata', 'nombre_tabla')
  - name: plata
    meta:
      # dbt-duckdb lee cada tabla directo de su archivo Parquet en data/silver/
      external_location: "data/silver/{name}.parquet"
    tables:
      - name: enerandes_ventas            # src/silver/enerandes.py
      - name: xm_mercado_horario          # src/silver/xm.py
      - name: xm_generacion_recurso
      - name: xm_hidrologia_diaria
      - name: xm_recursos
      - name: ideam_precipitacion_diaria  # src/silver/ideam.py
      - name: ideam_temperatura_diaria
      - name: ideam_estaciones
      - name: noaa_oni_mensual            # src/silver/noaa.py
      - name: nasa_power_diario           # src/silver/nasa_power.py
